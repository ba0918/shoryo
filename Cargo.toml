[package]
name = "shoryo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Run grill-me style brainstorm rounds on a local browser screen instead of the chat."
repository = "https://github.com/ba0918/shoryo"
publish = false

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
