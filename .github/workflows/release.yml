name: Release

# A release starts from a pushed version tag. The tag is created by hand on a commit whose
# changelog already has the version's heading and comparison link (CHANGELOG.md).
on:
  push:
    tags: ["v*"]

# The workflow only reads the repository; the publishing job widens its own permissions.
permissions:
  contents: read

# Releases are never cancelled half-way; a second tag waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # creates the GitHub release and uploads its files
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run the gates
        run: scripts/check.sh

      - name: Check that the tag, Cargo.toml and the changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-version.sh "$TAG"

      - name: Build and pack the static binary
        run: scripts/package-release.sh "$TARGET" dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "${TAG#v}" > dist/notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file dist/notes.md \
            "dist/shoryo-$TARGET.tar.gz" "dist/shoryo-$TARGET.tar.gz.sha256"
